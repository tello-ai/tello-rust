[package]
name = "tello-ai-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust WebSocket SDK for the Tello /sdk protocol: place a phone call and answer each caller turn."
license = "Apache-2.0"
repository = "https://github.com/tello-ai/tello-rust"
homepage = "https://telloai.io"
documentation = "https://docs.rs/tello-ai-sdk"
readme = "README.md"
keywords = ["tello", "voice", "telephony", "websocket", "sdk"]
categories = ["api-bindings", "asynchronous"]
# Ship the library, its READMEs, the license and the protocol contract copies.
# Examples read live credentials from examples/.env and stay out of the package.
include = [
    "/src/**",
    "/docs/**",
    "/README.md",
    "/README.ko.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/Cargo.toml",
]

[lib]
name = "tello"

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# An explicit ring provider: tokio-tungstenite enables rustls without any crypto
# provider, so its default TLS config would panic on the first wss:// connect.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53", features = ["net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
uuid = { version = "1.26", features = ["v4"] }
webpki-roots = "1"

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
